name: Render model previews

on:
  push:
    branches:
      - main
    paths:
      - "public/models/**/*.glb"
      - "src/data/modelos/**/*.md"

jobs:
  render:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build site
        run: pnpm build

      - name: Start preview server
        run: |
          pnpm preview --port 4321 > /tmp/preview.log 2>&1 &
          sleep 8

      - name: Wait for server
        run: npx wait-on http://localhost:4321 --timeout 60000

      - name: Render previews
        run: node scripts/render-preview.js
        env:
          BASE_URL: http://localhost:4321

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/previews/ src/data/modelos/
          if ! git diff --staged --quiet; then
            git commit -m "chore: generate model previews [skip ci]"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          else
            echo "committed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Netlify deploy
        if: steps.commit.outputs.committed == 'true'
        run: |
          curl -X POST ${{ secrets.NETLIFY_BUILD_HOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{}'
